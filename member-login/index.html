<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Login · Nomad Cycling Club</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Nomad Cycling Club</a>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="auth-card">
        <p class="eyebrow">Members area</p>
        <h1>Member Login</h1>
        <p id="authStatus" class="auth-status">Redirecting to Microsoft sign-in...</p>
        <p><a class="button button-primary" href="/.auth/login/aad?post_login_redirect_uri=/club-lounge">Sign in with Microsoft 365</a></p>
      </div>
    </section>
  </main>

  <script src="club-lounge.js"></script>
</body>
</html>
