<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalize Publish · Nomad Cycling Club</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html">Nomad Cycling Club</a>
      <nav class="site-nav" id="siteNav">
        <a href="/raceresults2026" class="member-login-link">Event Results 2026</a>
      </nav>
    </div>
  </header>

  <main class="results-2026-main">
    <section class="section container">
      <div class="results-hero">
        <p class="eyebrow">Secure Publish</p>
        <h1>Finalize Event Results Publish</h1>
        <p>Sign in with your nomadcyclingclub.com account, then publish this Excel draft to the live results page.</p>
      </div>

      <section class="race-admin-card">
        <p id="publishAuthStatus" class="auth-status">Checking authentication...</p>
        <p id="publishDraftStatus" class="auth-status"></p>
        <div class="race-form-actions">
          <a id="publishSignInLink" class="button button-secondary" href="#" hidden>Sign in</a>
          <button id="publishFinalizeBtn" class="button button-primary" type="button" hidden>Publish Now</button>
          <a id="publishViewBtn" class="button button-secondary" href="/raceresults2026" hidden>View Published Results</a>
        </div>
      </section>
    </section>
  </main>

  <script src="../script.js"></script>
  <script src="publish.js"></script>
</body>
</html>
